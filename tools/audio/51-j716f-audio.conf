# Keep the four CS35L41 hardware gains fixed; scale both channels in software.
# Use timer-based scheduling with headroom to prevent Qualcomm q6asm-dai
# IRQ/period stalls during full-duplex voice/video calls (e.g. WeChat).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        api.alsa.disable-mmap = true
        api.alsa.disable-tsched = false
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 1024
        api.alsa.start-delay = 1024
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
