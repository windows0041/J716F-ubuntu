# Lenovo TB-J716F Goodix GT7385P touchscreen.
# The kernel reports display-oriented coordinates and ranges; no Xorg
# calibration is required.
Section "InputClass"
        Identifier "Lenovo J716F Goodix touchscreen calibration"
        MatchProduct "Goodix Capacitive TouchScreen"
        MatchIsTouchscreen "on"
        Driver "libinput"
        Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
