[Unit]
Wants=j716f-qsee-supplicant.service j716f-goodixfp-loader.service
After=j716f-qsee-supplicant.service j716f-goodixfp-loader.service

[Service]
Environment=LD_LIBRARY_PATH=/opt/j716f-fingerprint/lib/aarch64-linux-gnu
Environment=FP_DRIVERS_ALLOWLIST=goodixj716f
ExecStartPre=/usr/bin/systemctl --quiet is-active j716f-qsee-supplicant.service j716f-goodixfp-loader.service
DeviceAllow=/dev/goodix_fp rw
DeviceAllow=char-tee rw
UMask=0077
