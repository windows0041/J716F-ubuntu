# Fixed hardware gain: CS35L41 digital 0 dB, analog minimum +0.5 dB.
# PipeWire uses software volume across all four amplifiers.
# Microphone: DMIC2 -> VA DEC0+DEC1 -> VA AIF1 -> VA_CODEC_DMA_TX_0 -> MM2.
# The VA DAPM path owns the DMIC clocks and reset.
SectionVerb {
    # DPCM routes must exist before PipeWire probes either PCM's hw_params.
    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
        cset "name='VA DMIC MUX0' DMIC2"
        cset "name='VA DMIC MUX1' DMIC2"
        cset "name='VA DEC0 MUX' VA_DMIC"
        cset "name='VA DEC1 MUX' VA_DMIC"
        cset "name='VA_AIF1_CAP Mixer DEC0' on"
        cset "name='VA_AIF1_CAP Mixer DEC1' on"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' on"
    ]
    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' off"
        cset "name='VA_AIF1_CAP Mixer DEC0' off"
        cset "name='VA_AIF1_CAP Mixer DEC1' off"
        cset "name='VA DMIC MUX0' ZERO"
        cset "name='VA DMIC MUX1' ZERO"
        cset "name='DMIC EN' off"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Built-in Speakers"
    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='Digital PCM Volume' 0"
        cset "name='SPK2 Digital PCM Volume' 0"
        cset "name='SPK3 Digital PCM Volume' 0"
        cset "name='SPK4 Digital PCM Volume' 0"
        cset "name='Analog PCM Volume' 0"
        cset "name='PCM Source' ASP"
        cset "name='SPK2 Analog PCM Volume' 0"
        cset "name='SPK2 PCM Source' ASP"
        cset "name='SPK3 Analog PCM Volume' 0"
        cset "name='SPK3 PCM Source' ASP"
        cset "name='SPK4 Analog PCM Volume' 0"
        cset "name='SPK4 PCM Source' ASP"
        cset "name='SPK2 SPK Switch' on"
        cset "name='SPK3 SPK Switch' on"
        cset "name='SPK4 SPK Switch' on"
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
        cset "name='Digital PCM Volume' 817"
        cset "name='SPK2 Digital PCM Volume' 817"
        cset "name='SPK3 Digital PCM Volume' 817"
        cset "name='SPK4 Digital PCM Volume' 817"
    ]
    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='Digital PCM Volume' 0"
        cset "name='SPK2 Digital PCM Volume' 0"
        cset "name='SPK3 Digital PCM Volume' 0"
        cset "name='SPK4 Digital PCM Volume' 0"
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
        cset "name='SPK2 SPK Switch' off"
        cset "name='SPK3 SPK Switch' off"
        cset "name='SPK4 SPK Switch' off"
    ]
    Value {
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
        PlaybackPriority 100
    }
}

SectionDevice."Mic" {
    Comment "Built-in Microphone"
    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='DMIC EN' on"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off"
        cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' off"
        cset "name='MultiMedia3 Mixer PRI_MI2S_TX' off"
        cset "name='VA_AIF1_CAP Mixer DEC2' off"
        cset "name='VA_AIF1_CAP Mixer DEC3' off"
        cset "name='VA DMIC MUX0' DMIC2"
        cset "name='VA DMIC MUX1' DMIC2"
        cset "name='VA DEC0 MUX' VA_DMIC"
        cset "name='VA DEC1 MUX' VA_DMIC"
        cset "name='VA_DEC0 Volume' 96"
        cset "name='VA_DEC1 Volume' 96"
        cset "name='VA_AIF1_CAP Mixer DEC0' on"
        cset "name='VA_AIF1_CAP Mixer DEC1' on"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' on"
    ]
    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' off"
        cset "name='VA_AIF1_CAP Mixer DEC0' off"
        cset "name='VA_AIF1_CAP Mixer DEC1' off"
        cset "name='VA DMIC MUX0' ZERO"
        cset "name='VA DMIC MUX1' ZERO"
        cset "name='DMIC EN' off"
    ]
    Value {
        CapturePCM "hw:${CardId},1"
        CaptureChannels 2
        CaptureRate 48000
        CapturePriority 100
    }
}
